# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_filters:
    # Keep reviews centered on authored runtime and configuration code. These
    # files are generated, binary, dependency snapshots, or covered by the
    # runtime code they exercise and made the initial mobile review too large.
    - "!app/mobile/assets/**"
    - "!app/mobile/convex/_generated/**"
    - "!app/mobile/package-lock.json"
    - "!app/mobile/patches/**"
    - "!app/mobile/tests/**"
    # Tooling and presentation-only files are validated by the app's own
    # checks; excluding them leaves CodeRabbit's 100-file budget for behavior.
    - "!**/.gitignore"
    - "!app/mobile/.prettierignore"
    - "!app/mobile/.prettierrc"
    - "!app/mobile/babel.config.js"
    - "!app/mobile/components.json"
    - "!app/mobile/convex/tsconfig.json"
    - "!app/mobile/eslint.config.js"
    - "!app/mobile/knip.json"
    - "!app/mobile/metro.config.js"
    - "!app/mobile/nativewind-env.d.ts"
    - "!app/mobile/tailwind.config.js"
    - "!app/mobile/tsconfig.json"
    - "!app/mobile/vitest.config.ts"
    - "!app/mobile/src/global.css"
    - "!app/mobile/src/constants/**"
    - "!app/mobile/src/lib/typography.ts"
    - "!app/mobile/src/lib/utils.ts"
    - "!app/mobile/src/types.ts"
    - "!app/mobile/src/components/*Skeleton*.tsx"
