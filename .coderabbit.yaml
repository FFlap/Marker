# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  path_filters:
    - "!app/mobile/assets/**"
    - "!app/shared/convex/_generated/**"
    - "!app/shared/package-lock.json"
    - "!app/shared/tests/**"
    - "!app/mobile/package-lock.json"
    - "!app/mobile/patches/**"
    - "!app/mobile/tests/**"
    - "!**/.gitignore"
    - "!app/mobile/.prettierignore"
    - "!app/mobile/.prettierrc"
    - "!app/mobile/babel.config.js"
    - "!app/mobile/components.json"
    - "!app/shared/convex/tsconfig.json"
    - "!app/mobile/eslint.config.js"
    - "!app/mobile/knip.json"
    - "!app/mobile/metro.config.js"
    - "!app/mobile/nativewind-env.d.ts"
    - "!app/mobile/tailwind.config.js"
    - "!app/mobile/tsconfig.json"
    - "!app/mobile/vitest.config.ts"
    - "!app/mobile/src/global.css"
    - "!app/mobile/src/constants/**"
    - "!app/mobile/src/lib/typography.ts"
    - "!app/mobile/src/lib/utils.ts"
    - "!app/mobile/src/types.ts"
    - "!app/mobile/src/components/*Skeleton*.tsx"
